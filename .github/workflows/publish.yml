name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OPENVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - run: npm test

      - run: node esbuild.js --production

      - name: Package .vsix
        run: npx vsce package --no-dependencies -o extension.vsix

      # Both registries are published below, Marketplace first, and a Marketplace
      # version can never be re-published. Failing between the two would leave a
      # half-shipped release that re-tagging cannot fix, so check both tokens up
      # front while nothing has shipped yet.
      - name: Verify publish tokens are present
        run: |
          [ -n "$VSCE_PAT" ] || { echo "::error::VSCODE_PAT is not set"; exit 1; }
          [ -n "$OVSX_PAT" ] || { echo "::error::OPENVSX_PAT is not set"; exit 1; }
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PAT }}

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath extension.vsix -p $VSCE_PAT
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish extension.vsix -p "$OVSX_PAT"
